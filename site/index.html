<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub 热门监控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <h1>📊 GitHub 热门监控</h1>
    <div class="controls">
      <select id="date-select" title="选择日期"></select>
      <span id="header-meta" class="muted"></span>
    </div>
  </div>
  <nav class="tabs wrap">
    <button class="tab-btn active" data-tab="trending">🔥 Trending</button>
    <button class="tab-btn" data-tab="radar">🚀 新项目雷达</button>
    <button class="tab-btn" data-tab="gainers">📈 Star 涨幅</button>
    <button class="tab-btn" data-tab="history">📉 历史趋势</button>
    <button class="tab-btn" data-tab="report">📄 推送日报</button>
  </nav>
</header>

<main class="wrap">
  <div id="empty" hidden>
    <p>暂无数据快照 —— 等 GitHub Actions 首次运行完成后刷新本页。</p>
  </div>

  <section id="panel-trending" class="tab-panel">
    <div class="filters">
      <select id="since-select"></select>
      <select id="lang-select"></select>
    </div>
    <div id="trending-list" class="repo-list"></div>
  </section>

  <section id="panel-radar" class="tab-panel" hidden>
    <p class="panel-note muted">最近 N 天创建且 star 已达标的新仓库（按 star 排序）—— 也许还没上 trending 的新星。</p>
    <div id="radar-list" class="repo-list"></div>
  </section>

  <section id="panel-gainers" class="tab-panel" hidden>
    <p class="panel-note muted">跟踪仓库 24h star 增量排行；高亮行 = 触发涨速告警。首日数据需预热（至少两次采样）。</p>
    <div id="gainers-wrap"></div>
  </section>

  <section id="panel-history" class="tab-panel" hidden>
    <div class="filters">
      <input id="repo-input" list="repo-datalist" placeholder="输入 owner/repo 加入对比曲线">
      <button id="repo-add">添加</button>
    </div>
    <datalist id="repo-datalist"></datalist>
    <div id="history-chips"></div>
    <div id="history-chart"></div>
  </section>

  <section id="panel-report" class="tab-panel" hidden>
    <p class="panel-note muted">每日推送到飞书 / 钉钉 / 企业微信的内容存档：</p>
    <pre id="digest-text" class="digest"></pre>
    <div id="snap-warnings" class="muted"></div>
    <h3>日报存档（仓库内 Markdown）</h3>
    <div id="report-links" class="report-links"></div>
  </section>
</main>

<footer class="wrap muted">
  数据由 GitHub Actions 定时自动采集 ·
  <a id="repo-link" href="#" target="_blank" rel="noopener">数据仓库</a> ·
  <a href="https://github.com/trending" target="_blank" rel="noopener">GitHub Trending</a>
</footer>

<script src="echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
